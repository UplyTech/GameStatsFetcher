name: Labels

# The labels in .github/labels.yml are the labels on the repository.
#
# Labels drift the moment somebody creates one from the issue sidebar. That is
# harmless until a workflow filters on one - stale.yml exempts several, pr.yml
# applies the size labels - and then a label renamed by hand silently switches
# an automation off.

on:
  push:
    branches: [main]
    paths:
      - .github/labels.yml
      - .github/workflows/labels.yml
  workflow_dispatch:
    inputs:
      prune:
        description: "Delete labels that are not in labels.yml"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: micnncim/action-label-syncer@3abd5ab72fda571e69fffd97bd4e0033dd5f495c # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          manifest: .github/labels.yml
          # Pruning deletes labels, and a deleted label is removed from every
          # issue that carried it. Off unless somebody asks for it by hand.
          prune: ${{ inputs.prune == true }}
